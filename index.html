<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen TV board. Header, a paged grid of game cards that rotates by league, and a scrolling ticker docked at the bottom. */
:root {
  --bg: #0a0e13;
  --panel: #121921;
  --line: #1f2b38;
  --text: #eaf0f6;
  --dim: #8797ab;
  --accent: #ffb020;
  --live: #ff4757;
  --ok: #3ddc97;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", Arial, Helvetica, sans-serif;
  color-scheme: dark;
}
html { font-size: calc(100vw / 120); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); height: 100vh; overflow: hidden; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; height: 100vh; width: 100vw; overflow: hidden; box-sizing: border-box; padding: 1.4rem 2.4rem 0; }

header { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
.brand { display: flex; align-items: center; gap: 0.8rem; font: 600 1.5rem/1 var(--display); letter-spacing: 0.18em; color: var(--dim); }
.dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--ok); }
.dot.bad { background: var(--accent); }
.league { font: 700 3rem/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); text-align: center; flex: 1; }
.league small { font: 500 1.4rem/1 var(--display); letter-spacing: 0.12em; color: var(--dim); margin-left: 1rem; }
.clock { text-align: right; font: 600 2.2rem/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; min-width: 14rem; }
.clock small { display: block; margin-top: 0.4rem; font: 500 1.1rem/1.2 var(--body); color: var(--dim); letter-spacing: 0.04em; white-space: nowrap; }

main { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 11.5rem); align-content: start; gap: 1rem; padding: 1.4rem 0; min-height: 0; animation: fade 0.5s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(0.6rem); } to { opacity: 1; transform: none; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 0.6rem; padding: 0.7rem 1.5rem 0.6rem; display: grid; grid-template-rows: auto 1fr 1fr auto; gap: 0.2rem; min-height: 0; }
.status { font: 600 1.25rem/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 0.6rem; }
.status.live { color: var(--live); }
.status.live::before { content: ""; width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.row { display: grid; grid-template-columns: 3rem 1fr auto; align-items: center; gap: 1rem; min-width: 0; }
.row img { width: 2.8rem; height: 2.8rem; object-fit: contain; }
.row .blank { width: 2.8rem; height: 2.8rem; }
.name { font: 600 2.1rem/1.05 var(--display); letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { font: 700 2.8rem/1 var(--display); font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }
.row.lose .name, .row.lose .score { color: var(--dim); }
.when { font: 600 1.7rem/1 var(--display); letter-spacing: 0.06em; color: var(--text); }

header, main, footer, .band { min-width: 0; }
.diag { display: inline-block; margin-top: 1rem; font: 500 1.4rem/1.3 var(--body); letter-spacing: 0.02em; color: var(--accent); }
.empty { grid-column: 1 / -1; align-self: center; text-align: center; font: 500 2.4rem/1.3 var(--display); letter-spacing: 0.06em; color: var(--dim); }

footer { margin: 0 -2.4rem; border-top: 1px solid var(--line); }
.band { display: flex; align-items: stretch; height: 3.4rem; }
.band + .band { border-top: 1px solid var(--line); }
.tag { flex: none; box-sizing: border-box; width: 12rem; display: flex; align-items: center; padding: 0 1.2rem 0 2.4rem; background: var(--panel); border-right: 1px solid var(--line); font: 700 1.2rem/1 var(--display); letter-spacing: 0.2em; color: var(--accent); }
.viewport { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; }
.track { display: inline-flex; white-space: nowrap; will-change: transform; animation: scroll var(--dur, 120s) linear infinite; }
.item { padding: 0 1.8rem; font: 600 1.7rem/1 var(--display); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.item b { color: var(--accent); font-weight: 700; letter-spacing: 0.12em; margin-right: 0.8rem; font-size: 1.3rem; }
.item i { font-style: normal; color: var(--dim); margin-left: 0.8rem; }
.item.live i { color: var(--live); }
.item.news { font: 500 1.55rem/1 var(--body); letter-spacing: 0.01em; }
.item.news b { font: 700 1.2rem/1 var(--display); letter-spacing: 0.14em; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .track { animation-duration: 400s; } main { animation: none; } }

/* Board and stats panel side by side */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem; min-height: 0; }
.stage.split { grid-template-columns: minmax(0, 1fr) 46rem; }
.stage > main { align-content: start; }
.panel { display: flex; flex-direction: column; min-height: 0; margin: 1.4rem 0; background: var(--panel); border: 1px solid var(--line); border-radius: 0.6rem; overflow: hidden; }
.panel[hidden] { display: none; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.4rem; border-bottom: 1px solid var(--line); }
.phead .stitle { font-size: 2rem; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1.4rem 2rem; scrollbar-width: none; }
.pbody::-webkit-scrollbar { display: none; }
.panel .sscore { margin: 0; padding: 1rem 1.4rem; gap: 1rem; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--bg); }
.panel .sscore .tm { font-size: 2rem; gap: 0.7rem; }
.panel .sscore .tm img { width: 3rem; height: 3rem; }
.panel .sscore .mid { font-size: 1.1rem; }
.panel .sscore .mid b { font-size: 3rem; margin-bottom: 0.3rem; }
.panel .sec { margin-top: 1.6rem; }
.panel .cols { grid-template-columns: minmax(0, 1fr); }
.panel table.st { font-size: 1.25rem; }
.panel table.st th, .panel table.st td { padding: 0.4rem 0.6rem; }
.panel .plays { font-size: 1.25rem; }
.panel .plays div { grid-template-columns: 8.5rem 1fr auto; gap: 0.8rem; padding: 0.4rem 0.6rem; }
.panel .hint { font-size: 1.35rem; }
.card.sel { border-color: var(--accent); }
.chan { margin-top: 0.2rem; padding-top: 0.3rem; border-top: 1px solid var(--line); font: 600 1.05rem/1.2 var(--display); letter-spacing: 0.04em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan:empty { display: none; }
.chan b { margin-right: 0.9rem; font-size: 0.85rem; letter-spacing: 0.18em; color: var(--accent); }
.chan span { margin-right: 1.2rem; }
.chan i { margin-right: 0.35rem; font-style: normal; color: var(--dim); }
.panel > .chan { margin: 0; padding: 0.7rem 1.4rem; font-size: 1.15rem; border-top: 0; border-bottom: 1px solid var(--line); }

/* Buttons, focus, and the pop-up sheet used for settings and game stats */
.btn { font: 700 1.25rem/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 0.4rem; padding: 0.8rem 1.3rem; cursor: pointer; }
.btn:hover, .btn:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.brand .btn { margin-left: 1.2rem; padding: 0.55rem 1rem; font-size: 1.1rem; }
.card { cursor: pointer; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; justify-content: center; overflow-y: auto; overflow-x: hidden; }
.overlay[hidden] { display: none; }
.sheet { width: min(112rem, 94vw); padding: 2rem 0 4rem; box-sizing: border-box; min-width: 0; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
.sbtns { display: flex; gap: 1rem; }
.stitle { font: 700 2.4rem/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.hint { font: 500 1.6rem/1.4 var(--body); color: var(--dim); max-width: 80rem; }
.sscore { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; margin: 1.6rem 0; padding: 1.4rem 2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 0.6rem; }
.sscore .tm { display: flex; align-items: center; gap: 1.2rem; font: 700 3.2rem/1 var(--display); text-transform: uppercase; min-width: 0; }
.sscore .tm.r { justify-content: flex-end; text-align: right; }
.sscore .tm img { width: 4.6rem; height: 4.6rem; object-fit: contain; flex: none; }
.sscore .tm.dim { color: var(--dim); }
.sscore .mid { text-align: center; font: 600 1.4rem/1.2 var(--display); letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
.sscore .mid b { display: block; margin-bottom: 0.5rem; font: 700 4.4rem/1 var(--display); letter-spacing: 0.04em; color: var(--text); font-variant-numeric: tabular-nums; }
.sscore .mid .live { color: var(--live); }
.sec { margin-top: 2.2rem; }
.sec > h3, .sgroup > h3 { margin: 0 0 0.8rem; font: 700 1.3rem/1 var(--display); letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; }
.tblock { min-width: 0; }
.tblock h3 { margin: 0 0 0.6rem; font: 700 2rem/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.gname { margin: 1rem 0 0.3rem; font: 600 1.2rem/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.scroll { overflow-x: auto; }
table.st { border-collapse: collapse; width: 100%; font: 500 1.45rem/1.2 var(--body); font-variant-numeric: tabular-nums; }
table.st th, table.st td { padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.st th { color: var(--dim); font-weight: 500; }
table.st td:first-child, table.st th:first-child { text-align: left; }
table.st tr.tot td { font-weight: 600; color: var(--accent); }
table.st td.wrap { white-space: normal; }
.plays { display: grid; gap: 0.4rem; font: 500 1.45rem/1.3 var(--body); }
.plays div { display: grid; grid-template-columns: 14rem 1fr auto; gap: 1.2rem; padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--line); }
.plays span:first-child { color: var(--dim); }
.plays span:last-child { font-variant-numeric: tabular-nums; color: var(--accent); }
.sgroup { margin-top: 2rem; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem 2rem; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.55rem 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 0.4rem; min-width: 0; }
.chk { display: flex; align-items: center; gap: 1rem; font: 600 1.8rem/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; min-width: 0; }
.chk input { width: 1.8rem; height: 1.8rem; accent-color: var(--accent); flex: none; }
.win { display: flex; align-items: center; gap: 0.5rem; font: 500 1.2rem/1 var(--body); color: var(--dim); white-space: nowrap; }
.win select { font: 500 1.2rem/1 var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 0.3rem; padding: 0.3rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot" id="dot"></span>SCOREBOARD<button class="btn" id="gear" type="button">Settings</button></div>
    <div class="league" id="leagueName">Loading</div>
    <div class="clock"><span id="clock">--:--</span><small id="updated">&nbsp;</small></div>
  </header>
  <div class="stage" id="stage">
    <main id="board" data-empty="1"><div class="empty">Loading scores&hellip;</div></main>
    <aside class="panel" id="panel" hidden></aside>
  </div>
  <footer>
    <div class="band"><div class="tag">RESULTS</div><div class="viewport"><div class="track" id="track"></div></div></div>
    <div class="band"><div class="tag">NEWS</div><div class="viewport"><div class="track" id="newsTrack"></div></div></div>
  </footer>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script>
/*
  Live scores from ESPN's public scoreboard feed (no key needed).
  Options in the page address:
    ?demo            show sample games to check the layout
    ?page=15         seconds each page stays on screen (default 12)
    ?leagues=nhl,nba,epl   only show these league ids
*/
var LEAGUES = [
  // North America
  { id: 'nfl',    name: 'NFL',                  path: 'football/nfl' },
  { id: 'cfl',    name: 'CFL',                  path: 'football/cfl' },
  { id: 'nba',    name: 'NBA',                  path: 'basketball/nba' },
  { id: 'nhl',    name: 'NHL',                  path: 'hockey/nhl' },
  { id: 'mlb',    name: 'MLB',                  path: 'baseball/mlb' },
  { id: 'wnba',   name: 'WNBA',                 path: 'basketball/wnba' },
  { id: 'mls',    name: 'MLS',                  path: 'soccer/usa.1' },
  { id: 'ncaaf',  name: 'College Football',     path: 'football/college-football' },
  { id: 'ncaam',  name: 'College Basketball',   path: 'basketball/mens-college-basketball' },
  // Soccer
  { id: 'epl',    name: 'Premier League',       path: 'soccer/eng.1' },
  { id: 'ucl',    name: 'Champions League',     path: 'soccer/uefa.champions' },
  { id: 'uel',    name: 'Europa League',        path: 'soccer/uefa.europa' },
  { id: 'uecl',   name: 'Conference League',    path: 'soccer/uefa.europa.conf' },
  { id: 'champ',  name: 'Championship',         path: 'soccer/eng.2' },
  { id: 'fa',     name: 'FA Cup',               path: 'soccer/eng.fa' },
  { id: 'efl',    name: 'League Cup',           path: 'soccer/eng.league_cup' },
  { id: 'spl',    name: 'Scottish Premiership', path: 'soccer/sco.1' },
  { id: 'laliga', name: 'La Liga',              path: 'soccer/esp.1' },
  { id: 'bund',   name: 'Bundesliga',           path: 'soccer/ger.1' },
  { id: 'seriea', name: 'Serie A',              path: 'soccer/ita.1' },
  { id: 'ligue1', name: 'Ligue 1',              path: 'soccer/fra.1' },
  { id: 'ligamx', name: 'Liga MX',              path: 'soccer/mex.1' },
  { id: 'wc',     name: 'World Cup',            path: 'soccer/fifa.world' },
  { id: 'euro',   name: 'Euros',                path: 'soccer/uefa.euro' },
  { id: 'nations',name: 'Nations League',       path: 'soccer/uefa.nations' },
  { id: 'friend', name: 'International Friendlies', path: 'soccer/fifa.friendly' },
  // Other
  { id: 'cricket',name: 'Cricket',              path: 'cricket/scoreboard', alt: true }
];

/*
  Where to watch. US channels come with each game from ESPN's feed.
  Canada (ca) and UK (uk) are the usual broadcasters for each league, set here, because the
  feed has no data for them. A league with no entry just shows nothing for that country.
  Rights change and some games are on a different channel, so edit this list when you notice a difference.
  Last checked: November 2026.
*/
var CHANNELS = {
  ca: {
    nfl: ['TSN', 'CTV'], cfl: ['TSN'], nba: ['TSN', 'Sportsnet'], nhl: ['Sportsnet', 'CBC'], mlb: ['Sportsnet'],
    wnba: ['TSN'], mls: ['Apple TV', 'TSN'], ncaaf: ['TSN'], ncaam: ['TSN'],
    epl: ['Fubo'], champ: ['DAZN'], efl: ['DAZN'], ucl: ['DAZN'], uel: ['DAZN'], uecl: ['DAZN'],
    cricket: ['Willow']
  },
  uk: {
    nfl: ['Sky Sports', 'Channel 5'], nba: ['Sky Sports', 'Prime Video'], nhl: ['Premier Sports'],
    epl: ['Sky Sports', 'TNT Sports'], champ: ['Sky Sports'], fa: ['BBC', 'TNT Sports'], efl: ['Sky Sports'],
    spl: ['Sky Sports'], ucl: ['TNT Sports', 'Prime Video'], uel: ['TNT Sports'], uecl: ['TNT Sports'],
    wc: ['BBC', 'ITV'], euro: ['BBC', 'ITV'], cricket: ['Sky Sports']
  }
};

var params = new URLSearchParams(location.search);
var PAGE_MS = (parseInt(params.get('page'), 10) || 12) * 1000;
var REFRESH_MS = 60 * 1000;
var PER_PAGE = 8;
var DEMO = params.has('demo');
var only = params.get('leagues');
if (only) {
  var want = only.toLowerCase().split(',');
  LEAGUES = LEAGUES.filter(function (l) { return want.indexOf(l.id) !== -1; });
}

var store = {};          // league id -> games from the last good fetch
var pages = [];
var pageIndex = 0;
var sigs = {};           // last content of each scrolling band
var news = [];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }

function whenText(d) {
  var t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  var today = new Date();
  if (d.toDateString() === today.toDateString()) return t;
  return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + t;
}

function scoreText(c) {
  var s = c.score;
  if (s == null) return null;
  if (typeof s === 'object') s = s.displayValue != null ? s.displayValue : (s.value != null ? s.value : null);
  if (s === null || s === '') return null;
  return String(s);
}

// US channels for one game, from the feed. National ones first; regional ones only if there is no national channel.
function usChannels(comp) {
  var nat = [], loc = [];
  function add(list, n) { if (n && list.indexOf(n) === -1) list.push(n); }
  (comp.geoBroadcasts || []).forEach(function (b) {
    var type = b.type && b.type.shortName;
    if (type && /radio/i.test(type)) return;
    if (b.region && !/^us$/i.test(b.region)) return;
    var m = b.market && (b.market.type || b.market);
    add(/national/i.test(String(m)) ? nat : loc, b.media && (b.media.shortName || b.media.name));
  });
  if (!nat.length && !loc.length) {
    (comp.broadcasts || []).forEach(function (b) {
      (b.names || []).forEach(function (n) { add(/national/i.test(String(b.market)) ? nat : loc, n); });
    });
  }
  if (!nat.length && !loc.length && typeof comp.broadcast === 'string') add(nat, comp.broadcast);
  return { nat: nat, loc: loc };
}

function normalize(e, league) {
  var comp = e.competitions && e.competitions[0];
  if (!comp) return null;
  var cs = (comp.competitors || []).slice();
  if (cs.length < 2) return null;
  var st = (e.status && e.status.type) || (comp.status && comp.status.type) || {};
  var detail = st.shortDetail || st.detail || st.description || '';
  if (/postponed|cancel|suspend|delayed start/i.test(detail + ' ' + (st.name || ''))) return null;
  var home = cs.filter(function (c) { return c.homeAway === 'home'; })[0] || cs[1];
  var away = cs.filter(function (c) { return c.homeAway === 'away'; })[0] || cs[0];
  function side(c) {
    var t = c.team || c.athlete || {};
    return {
      id: t.id,
      abbr: t.abbreviation || t.shortDisplayName || t.displayName || '?',
      name: t.shortDisplayName || t.displayName || t.name || t.abbreviation || '',
      logo: t.logo || '',
      score: scoreText(c),
      winner: !!c.winner,
      lines: (c.linescores || []).map(function (x) { return x.displayValue != null ? x.displayValue : (x.value != null ? x.value : ''); })
    };
  }
  return {
    eid: e.id,
    us: usChannels(comp),
    id: league.id + ':' + e.id,
    league: league,
    start: new Date(e.date),
    state: st.state || 'pre',
    detail: detail,
    away: side(away),
    home: side(home)
  };
}

function inWindow(g) {
  if (g.state === 'in') return true;
  var dt = g.start.getTime() - Date.now();
  if (g.state === 'post') return dt > -30 * 3600 * 1000;
  return dt < 24 * 3600 * 1000;
}

function rank(g) { return g.state === 'in' ? 0 : (g.state === 'pre' ? 1 : 2); }
function sortGames(a, b) {
  var r = rank(a) - rank(b);
  if (r) return r;
  return rank(a) === 2 ? b.start - a.start : a.start - b.start;
}

// Runs fn over items a few at a time with a short pause, so the feed is not hit with dozens of requests at once.
async function pool(items, size, fn) {
  var out = new Array(items.length), next = 0;
  async function worker() {
    while (next < items.length) {
      var k = next++;
      try { out[k] = { status: 'fulfilled', value: await fn(items[k]) }; }
      catch (e) { out[k] = { status: 'rejected', reason: e }; }
      await new Promise(function (r) { setTimeout(r, 200); });
    }
  }
  var workers = [];
  for (var w = 0; w < size; w++) workers.push(worker());
  await Promise.all(workers);
  return out;
}

async function loadLeague(l) {
  var now = new Date();
  var from = new Date(now.getTime() - 24 * 3600 * 1000);
  var to = new Date(now.getTime() + 24 * 3600 * 1000);
  var base = 'https://site.api.espn.com/apis/site/v2/sports/' + l.path + (l.alt ? '' : '/scoreboard');
  async function get(url) {
    var r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(l.id + ' HTTP ' + r.status);
    return r.json();
  }
  var j;
  try { j = await get(base + '?dates=' + ymd(from) + '-' + ymd(to)); }   // yesterday to tomorrow
  catch (e1) {
    if (!/HTTP 4/.test(String(e1.message))) throw e1;                      // network trouble: do not hammer the feed
    j = await get(base);                                                   // plain request: today's games
  }
  var games = [];
  (j.events || []).forEach(function (e) {
    try {
      var g = normalize(e, l);
      if (g) games.push(g);
    } catch (e2) { /* skip one odd entry instead of losing the league */ }
  });
  return games;
}

function demoGames() {
  var now = Date.now();
  function mk(lid, lname, a, b, as, bs, state, detail, mins) {
    return { id: lid + a + b, league: { id: lid, name: lname }, start: new Date(now + mins * 60000), state: state, detail: detail,
      away: { abbr: a, name: a, logo: '', score: as, winner: state === 'post' && as > bs },
      home: { abbr: b, name: b, logo: '', score: bs, winner: state === 'post' && bs > as } };
  }
  return {
    nhl: [mk('nhl', 'NHL', 'Canucks', 'Oilers', '2', '3', 'in', '3rd 8:42', -100), mk('nhl', 'NHL', 'Bruins', 'Rangers', '4', '1', 'post', 'Final', -200), mk('nhl', 'NHL', 'Flames', 'Jets', null, null, 'pre', '', 90)],
    nba: [mk('nba', 'NBA', 'Lakers', 'Celtics', '98', '101', 'in', '4th 2:10', -120), mk('nba', 'NBA', 'Raptors', 'Heat', null, null, 'pre', '', 150)],
    epl: [mk('epl', 'Premier League', 'Arsenal', 'Chelsea', '1', '1', 'in', "67'", -70), mk('epl', 'Premier League', 'Liverpool', 'Spurs', '2', '0', 'post', 'FT', -240)]
  };
}

async function refresh() {
  var ok = true;
  if (DEMO) {
    store = demoGames();
  } else {
    var wanted = LEAGUES.filter(function (l) { return leagueActive(l.id); });   // skip leagues that are switched off
    var results = await pool(wanted, 3, loadLeague);
    var good = 0, firstErr = '';
    results.forEach(function (res, i) {
      var l = wanted[i];
      if (res.status === 'fulfilled') { store[l.id] = res.value; good++; }
      else if (!l.alt) { ok = false; if (!firstErr) firstErr = String(res.reason && res.reason.message || res.reason); }
    });
    window.__status = good + ' of ' + wanted.length + ' leagues loaded' + (firstErr ? ' (' + firstErr + ')' : '');
  }
  $('dot').className = 'dot' + (ok ? '' : ' bad');
  var stamp = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('updated').textContent = ok ? 'Updated ' + stamp : 'Updated ' + stamp + ' - ' + (window.__status || 'some leagues failed');
  buildPages();
  renderTicker();
  if (!$('board').children.length || $('board').dataset.empty) renderPage();
}

function buildPages() {
  var groups = [];
  // Finished games live in the results band. The board shows them only when nothing else is on.
  var ids = Object.keys(store).filter(leagueActive);
  var anyActive = ids.some(function (id) {
    return store[id].some(function (g) { return g.state !== 'post' && inWindow(g); });
  });
  ids.forEach(function (id) {
    var games = store[id].filter(function (g) { return inWindow(g) && (!anyActive || g.state !== 'post'); }).sort(sortGames);
    if (games.length) groups.push({ name: games[0].league.name, games: games, live: games[0].state === 'in', order: LEAGUES.map(function (l) { return l.id; }).indexOf(id) });
  });
  groups.sort(function (a, b) { return (a.live === b.live ? 0 : a.live ? -1 : 1) || a.order - b.order; });
  pages = [];
  groups.forEach(function (g) {
    var n = Math.ceil(g.games.length / PER_PAGE);
    for (var i = 0; i < n; i++) pages.push({ name: g.name, part: i + 1, of: n, games: g.games.slice(i * PER_PAGE, (i + 1) * PER_PAGE) });
  });
  if (pageIndex >= pages.length) pageIndex = 0;
}

function teamRow(t, lose) {
  var logo = t.logo ? '<img src="' + esc(t.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<span class="blank"></span>';
  return '<div class="row' + (lose ? ' lose' : '') + '">' + logo + '<div class="name">' + esc(t.name) + '</div><div class="score">' + (t.score == null ? '' : esc(t.score)) + '</div></div>';
}

// The "where to watch" line under a game. Finished games do not need one.
function chanLine(g) {
  if (g.state === 'post') return '<div class="chan"></div>';
  var us = g.us || { nat: [], loc: [] };
  var usList = us.nat.slice(0, 3).join(', ');          // national networks and services only, no regional channels
  var lg = g.league.id;
  var parts = [['US', usList], ['CA', (CHANNELS.ca[lg] || []).join(', ')], ['UK', (CHANNELS.uk[lg] || []).join(', ')]]
    .filter(function (p) { return p[1]; })
    .map(function (p) { return '<span><i>' + p[0] + '</i>' + esc(p[1]) + '</span>'; });
  return '<div class="chan">' + (parts.length ? '<b>NATIONAL</b>' + parts.join('') : '') + '</div>';
}

function card(g) {
  var status, cls = 'status';
  if (g.state === 'in') { cls += ' live'; status = g.detail || 'Live'; }
  else if (g.state === 'post') status = g.detail || 'Final';
  else status = whenText(g.start);
  var awayLose = g.state === 'post' && g.home.winner && !g.away.winner;
  var homeLose = g.state === 'post' && g.away.winner && !g.home.winner;
  return '<div class="card' + (g.id === openGid ? ' sel' : '') + '" tabindex="0" role="button" data-gid="' + esc(g.id) + '"><div class="' + cls + '">' + esc(status) + '</div>' + teamRow(g.away, awayLose) + teamRow(g.home, homeLose) + chanLine(g) + '</div>';
}

function renderPage() {
  var board = $('board');
  var next = board.cloneNode(false);
  if (!pages.length) {
    $('leagueName').textContent = 'No games right now';
    next.dataset.empty = '1';
    next.innerHTML = '<div class="empty">No live or upcoming games in the next 24 hours.<br>Scores will appear here as soon as games are on.' +
      (window.__status ? '<br><span class="diag">' + esc(window.__status) + '</span>' : '') + '</div>';
  } else {
    var p = pages[pageIndex];
    $('leagueName').innerHTML = esc(p.name) + (pages.length > 1 ? '<small>' + (pageIndex + 1) + ' / ' + pages.length + '</small>' : '');
    next.innerHTML = p.games.map(card).join('');
  }
  board.parentNode.replaceChild(next, board);
}

function tickerItem(g) {
  var mid;
  if (g.state === 'pre') mid = esc(g.away.abbr) + ' v ' + esc(g.home.abbr);
  else mid = esc(g.away.abbr) + ' ' + esc(g.away.score == null ? '-' : g.away.score) + ' &ndash; ' + esc(g.home.score == null ? '-' : g.home.score) + ' ' + esc(g.home.abbr);
  var tail = g.state === 'pre' ? whenText(g.start) : (g.detail || (g.state === 'post' ? 'Final' : 'Live'));
  return '<span class="item' + (g.state === 'in' ? ' live' : '') + '"><b>' + esc(tagOf(g.league)) + '</b>' + mid + '<i>' + esc(tail) + '</i></span>';
}

var TAGS = { epl: 'EPL', ucl: 'UCL', uel: 'UEL', uecl: 'UECL', champ: 'EFL', fa: 'FA CUP', efl: 'LEAGUE CUP', spl: 'SPFL',
  laliga: 'LA LIGA', bund: 'BUNDES', seriea: 'SERIE A', ligue1: 'LIGUE 1', ligamx: 'LIGA MX', wc: 'WORLD CUP', euro: 'EUROS',
  nations: 'NATIONS', friend: 'FRIENDLY', ncaaf: 'NCAAF', ncaam: 'NCAAM' };
function tagOf(l) { return TAGS[l.id] || String(l.id).toUpperCase(); }

// Fills one scrolling band. If the content did not change, the scroll keeps going without a jump.
function setBand(id, html, pxPerSec) {
  if (sigs[id] === html) return;
  sigs[id] = html;
  var track = $(id);
  track.innerHTML = html;
  var w = Math.max(track.scrollWidth, 1);
  var reps = Math.max(1, Math.ceil(track.parentNode.clientWidth / w));   // repeat short lists so there is no empty gap
  var unit = new Array(reps + 1).join(html);
  track.innerHTML = unit + unit;                                         // twice, so the loop is seamless
  var half = track.scrollWidth / 2;
  track.style.setProperty('--dur', Math.max(30, Math.round(half / (window.innerWidth / 1920 * pxPerSec))) + 's');
}

// Results band: live games first, then finished games from the last day.
function renderTicker() {
  var list = [];
  Object.keys(store).filter(leagueActive).forEach(function (id) {
    store[id].forEach(function (g) { if (g.state !== 'pre' && inWindow(g)) list.push(g); });
  });
  list.sort(function (a, b) { return rank(a) - rank(b) || b.start - a.start; });
  var html = list.map(tickerItem).join('');
  if (!html) html = '<span class="item"><i>No results yet</i></span>';
  setBand('track', html, 110);
}

function renderNews() {
  var html = news.filter(function (n) { return leagueActive(n.league.id); }).map(function (n) {
    return '<span class="item news"><b>' + esc(tagOf(n.league)) + '</b>' + esc(n.text) + '</span>';
  }).join('');
  if (!html) html = '<span class="item news"><i>Headlines will appear here</i></span>';
  setBand('newsTrack', html, 85);
}

// Headlines come from the leagues that have games in the window, a few from each in turn.
async function loadNews() {
  if (DEMO) {
    news = [
      { league: { id: 'nhl' }, text: 'Sample headline: Oilers extend win streak with overtime goal' },
      { league: { id: 'epl' }, text: 'Sample headline: Arsenal and Chelsea share the points at the Emirates' },
      { league: { id: 'nba' }, text: 'Sample headline: Celtics hold off late Lakers charge' }
    ];
    renderNews();
    return;
  }
  var active = LEAGUES.filter(function (l) { return !l.alt && leagueActive(l.id) && store[l.id] && store[l.id].length; });
  if (!active.length) active = LEAGUES.filter(function (l) { return leagueActive(l.id) && ['nfl', 'nba', 'nhl', 'epl', 'ucl'].indexOf(l.id) !== -1; });
  var results = await pool(active.slice(0, 12), 3, async function (l) {
    var r = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + l.path + '/news?limit=5', { cache: 'no-store' });
    if (!r.ok) throw new Error(l.id + ' news ' + r.status);
    var j = await r.json();
    return (j.articles || []).filter(function (a) { return a.headline; }).slice(0, 4).map(function (a) { return { league: l, text: a.headline }; });
  });
  var lists = [];
  results.forEach(function (res) { if (res.status === 'fulfilled' && res.value.length) lists.push(res.value); });
  var out = [], seen = {};
  for (var i = 0; i < 4 && out.length < 40; i++) {
    lists.forEach(function (list) {
      var n = list[i];
      if (n && !seen[n.text]) { seen[n.text] = 1; out.push(n); }
    });
  }
  if (out.length) news = out;     // keep the last headlines if this fetch came back empty
  renderNews();
}

/* ---------- settings: which leagues to show, and when ---------- */
var settings = loadSettings();
var applyTimer = null;

function loadSettings() {
  var s = { off: {}, win: {} };
  try {
    var p = JSON.parse(localStorage.getItem('scoreboard.settings') || 'null');
    if (p && p.off) s.off = p.off;
    if (p && p.win) s.win = p.win;
  } catch (e) { /* storage blocked: settings last until the page closes */ }
  return s;
}
function saveSettings() { try { localStorage.setItem('scoreboard.settings', JSON.stringify(settings)); } catch (e) { } }

// A league shows when it is ticked and, if it has a From/To time, only inside that daily window.
function leagueActive(id) {
  if (settings.off[id]) return false;
  var w = settings.win[id];
  if (!w || (w[0] == null && w[1] == null)) return true;
  var d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  var a = w[0] == null ? 0 : w[0], b = w[1] == null ? 1440 : w[1];
  if (a === b) return true;
  return a < b ? (m >= a && m < b) : (m >= a || m < b);       // a later "from" than "to" means overnight
}

function groupOf(l) {
  if (['nfl', 'cfl', 'nba', 'nhl', 'mlb', 'wnba', 'mls', 'ncaaf', 'ncaam'].indexOf(l.id) !== -1) return 'North America';
  return String(l.path).indexOf('soccer/') === 0 ? 'Soccer' : 'Other';
}

function clockLabel(m) {
  var h = Math.floor(m / 60), ap = h < 12 ? 'AM' : 'PM';
  return (h % 12 || 12) + ':' + pad(m % 60) + ' ' + ap;
}
function timeOptions(sel) {
  var h = '<option value=""' + (sel == null ? ' selected' : '') + '>Any</option>';
  for (var m = 0; m < 1440; m += 30) h += '<option value="' + m + '"' + (sel === m ? ' selected' : '') + '>' + clockLabel(m) + '</option>';
  return h;
}
function leagueRow(l) {
  var w = settings.win[l.id] || [null, null];
  return '<div class="srow"><label class="chk"><input type="checkbox" data-lg="' + esc(l.id) + '"' + (settings.off[l.id] ? '' : ' checked') + '>' + esc(l.name) + '</label>' +
    '<span class="win">From <select data-from="' + esc(l.id) + '">' + timeOptions(w[0]) + '</select> to <select data-to="' + esc(l.id) + '">' + timeOptions(w[1]) + '</select></span></div>';
}

function renderSettings(first) {
  var groups = {};
  LEAGUES.forEach(function (l) { var k = groupOf(l); (groups[k] = groups[k] || []).push(l); });
  var h = '<div class="shead"><div class="stitle">Choose what to show</div><div class="sbtns">' +
    '<button class="btn" type="button" data-act="allon">All on</button><button class="btn" type="button" data-act="alloff">All off</button>' +
    '<button class="btn" type="button" id="closeBtn" data-close="1">Done</button></div></div>' +
    '<p class="hint">Untick a league to hide it. To show a league only at certain times of day, set From and To (leave both on Any to show it all day). These choices are saved on this device.</p>';
  ['North America', 'Soccer', 'Other'].forEach(function (k) {
    if (groups[k]) h += '<div class="sgroup"><h3>' + k + '</h3><div class="sgrid">' + groups[k].map(leagueRow).join('') + '</div></div>';
  });
  var o = $('overlay'), top = o.scrollTop;
  $('sheet').innerHTML = h;
  o.hidden = false;
  overlayMode = 'settings';
  o.scrollTop = first ? 0 : top;
  if (first) $('closeBtn').focus();
}

function applySettings() {
  saveSettings();
  buildPages();
  renderTicker();
  renderNews();
  renderPage();
  clearTimeout(applyTimer);
  applyTimer = setTimeout(function () { refresh().then(loadNews); }, 1200);   // fetch anything newly switched on
}

/* ---------- game stats pop-up ---------- */
var overlayMode = null, openGid = null, gameData = null, gameErr = '';
var autoScroll = { pos: null, pauseUntil: 0, last: 0, hover: false, wrap: false };
var lastInput = Date.now();

function closeOverlay() {            // the full-screen settings sheet
  $('overlay').hidden = true;
  overlayMode = null;
}

function markSelected() {
  document.querySelectorAll('.card').forEach(function (c) { c.classList.toggle('sel', c.getAttribute('data-gid') === openGid); });
}

function closePanel() {              // the game stats panel beside the board
  openGid = null; gameData = null; gameErr = '';
  $('panel').hidden = true;
  $('panel').innerHTML = '';
  $('stage').classList.remove('split');
  markSelected();
}

function findGame(gid) {
  var found = null;
  Object.keys(store).forEach(function (id) { store[id].forEach(function (g) { if (g.id === gid) found = g; }); });
  return found;
}

async function fetchSummary(g) {
  if (DEMO || !g.league.path || g.league.alt || !g.eid) return null;
  var r = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + g.league.path + '/summary?event=' + encodeURIComponent(g.eid), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// Puts [away, home] in that order when the team ids can be matched, otherwise leaves the feed's order.
function awayHome(arr, getTeam, g) {
  var aw = null, hm = null;
  arr.forEach(function (x) {
    var t = getTeam(x) || {};
    if (g.away.id != null && String(t.id) === String(g.away.id)) aw = x;
    else if (g.home.id != null && String(t.id) === String(g.home.id)) hm = x;
  });
  return aw && hm ? [aw, hm] : arr.slice();
}

function lineScore(g) {
  var al = g.away.lines || [], hl = g.home.lines || [];
  var n = Math.max(al.length, hl.length);
  if (!n || g.state === 'pre') return '';
  function row(t) {
    var h = '<tr><td>' + esc(t.abbr) + '</td>';
    var ln = t.lines || [];
    for (var i = 0; i < n; i++) h += '<td>' + esc(ln[i] == null ? '' : ln[i]) + '</td>';
    return h + '<td><b>' + esc(t.score == null ? '' : t.score) + '</b></td></tr>';
  }
  var head = '<tr><th></th>';
  for (var i = 1; i <= n; i++) head += '<th>' + i + '</th>';
  return '<div class="sec"><h3>By period</h3><div class="scroll"><table class="st">' + head + '<th>T</th></tr>' + row(g.away) + row(g.home) + '</table></div></div>';
}

function teamStatsHtml(d, g) {
  var ts = (d.boxscore && d.boxscore.teams) || [];
  if (ts.length < 2) return '';
  ts = awayHome(ts, function (x) { return x.team; }, g);
  var other = {};
  (ts[1].statistics || []).forEach(function (s) { other[s.label || s.name] = s.displayValue; });
  var rows = (ts[0].statistics || []).filter(function (s) { return s.label || s.name; }).map(function (s) {
    var k = s.label || s.name;
    return '<tr><td>' + esc(k) + '</td><td>' + esc(s.displayValue) + '</td><td>' + esc(other[k] != null ? other[k] : '') + '</td></tr>';
  });
  if (!rows.length) return '';
  return '<div class="sec"><h3>Team stats</h3><div class="scroll"><table class="st"><tr><th></th><th>' + esc(g.away.abbr) + '</th><th>' + esc(g.home.abbr) + '</th></tr>' + rows.join('') + '</table></div></div>';
}

function leadersHtml(d, g) {
  var ls = d.leaders || [];
  if (ls.length < 2) return '';
  ls = awayHome(ls, function (x) { return x.team; }, g);
  function pick(team, name) {
    var c = (team.leaders || []).filter(function (x) { return x.displayName === name; })[0];
    var top = c && c.leaders && c.leaders[0];
    if (!top) return '';
    return ((top.athlete && (top.athlete.shortName || top.athlete.displayName)) || '') + ' ' + (top.displayValue || '');
  }
  var rows = (ls[0].leaders || []).map(function (c) {
    return '<tr><td>' + esc(c.displayName || c.name) + '</td><td class="wrap">' + esc(pick(ls[0], c.displayName)) + '</td><td class="wrap">' + esc(pick(ls[1], c.displayName)) + '</td></tr>';
  });
  if (!rows.length) return '';
  return '<div class="sec"><h3>Leaders</h3><div class="scroll"><table class="st"><tr><th></th><th>' + esc(g.away.abbr) + '</th><th>' + esc(g.home.abbr) + '</th></tr>' + rows.join('') + '</table></div></div>';
}

function playsHtml(d) {
  var items = [];
  (d.scoringPlays || []).forEach(function (p) {
    var per = p.period ? (p.period.displayValue || ('P' + p.period.number)) : '';
    items.push({ when: (per + ' ' + (p.clock && p.clock.displayValue || '')).trim(), text: p.text || (p.type && p.type.text) || '', score: p.awayScore != null ? p.awayScore + '-' + p.homeScore : '' });
  });
  if (!items.length) {
    (d.keyEvents || []).forEach(function (k) {
      var t = (k.type && k.type.text) || '';
      if (k.scoringPlay || /goal|card|penalty|red|yellow/i.test(t)) items.push({ when: (k.clock && k.clock.displayValue) || '', text: k.text || k.shortText || t, score: '' });
    });
  }
  if (!items.length) return '';
  return '<div class="sec"><h3>Scoring and key moments</h3><div class="plays">' + items.slice(0, 30).map(function (i) {
    return '<div><span>' + esc(i.when) + '</span><span>' + esc(i.text) + '</span><span>' + esc(i.score) + '</span></div>';
  }).join('') + '</div></div>';
}

function playersHtml(d, g) {
  var ps = (d.boxscore && d.boxscore.players) || [];
  if (!ps.length) return '';
  ps = awayHome(ps, function (x) { return x.team; }, g);
  var cols = ps.map(function (tp) {
    var h = '<div class="tblock"><h3>' + esc((tp.team && (tp.team.displayName || tp.team.name)) || '') + '</h3>';
    (tp.statistics || []).forEach(function (grp) {
      var labels = grp.labels || [];
      var ath = (grp.athletes || []).slice(0, 25);
      if (!ath.length) return;
      var title = grp.text || grp.name || '';
      h += (title ? '<div class="gname">' + esc(title) + '</div>' : '') + '<div class="scroll"><table class="st"><tr><th>Player</th>' +
        labels.map(function (l) { return '<th>' + esc(l) + '</th>'; }).join('') + '</tr>';
      ath.forEach(function (a) {
        var st = a.stats || [];
        h += '<tr><td>' + esc((a.athlete && (a.athlete.shortName || a.athlete.displayName)) || '') + '</td>' +
          labels.map(function (_, i) { return '<td>' + esc(st[i] != null ? st[i] : '') + '</td>'; }).join('') + '</tr>';
      });
      if (grp.totals && grp.totals.length) h += '<tr class="tot"><td>Total</td>' + labels.map(function (_, i) { return '<td>' + esc(grp.totals[i] != null ? grp.totals[i] : '') + '</td>'; }).join('') + '</tr>';
      h += '</table></div>';
    });
    return h + '</div>';
  });
  return '<div class="sec"><h3>Players</h3><div class="cols">' + cols.join('') + '</div></div>';
}

// Soccer feeds list players under rosters instead of box score tables.
function rosterHtml(d, g) {
  if (d.boxscore && d.boxscore.players && d.boxscore.players.length) return '';
  var rs = d.rosters || [];
  if (!rs.length) return '';
  rs = awayHome(rs, function (x) { return x.team; }, g);
  var cols = rs.map(function (r) {
    var rows = (r.roster || []).filter(function (p) { return p.starter || p.subbedIn; }).map(function (p) {
      var stats = (p.stats || []).filter(function (s) { return s.displayValue && !/^0(\.0+)?$/.test(String(s.displayValue)); })
        .slice(0, 6).map(function (s) { return (s.abbreviation || s.shortDisplayName || s.name) + ' ' + s.displayValue; }).join(', ');
      var pos = p.position && p.position.abbreviation ? p.position.abbreviation : '';
      return '<tr><td>' + esc((p.jersey ? p.jersey + ' ' : '') + ((p.athlete && (p.athlete.shortName || p.athlete.displayName)) || '')) + '</td><td>' + esc(pos) + '</td><td class="wrap">' + esc(stats) + '</td></tr>';
    });
    if (!rows.length) return '';
    return '<div class="tblock"><h3>' + esc((r.team && (r.team.displayName || r.team.name)) || '') + '</h3><div class="scroll"><table class="st"><tr><th>Player</th><th>Pos</th><th>Stats</th></tr>' + rows.join('') + '</table></div></div>';
  }).join('');
  return cols ? '<div class="sec"><h3>Players</h3><div class="cols">' + cols + '</div></div>' : '';
}

function detailBody(d, g) {
  var out = '';
  [teamStatsHtml, leadersHtml, playsHtml, playersHtml, rosterHtml].forEach(function (fn) {
    try { out += fn(d, g); } catch (e) { /* one odd section should not hide the rest */ }
  });
  return out;
}

function renderGame(first) {
  var g = findGame(openGid);
  if (!g) { closePanel(); return; }
  var live = g.state === 'in';
  var status = g.state === 'pre' ? whenText(g.start) : (g.detail || (g.state === 'post' ? 'Final' : 'Live'));
  var logo = function (t) { return t.logo ? '<img src="' + esc(t.logo) + '" alt="">' : ''; };
  var loseA = g.state === 'post' && g.home.winner && !g.away.winner, loseH = g.state === 'post' && g.away.winner && !g.home.winner;
  var head = '<div class="phead"><div class="stitle">' + esc(g.league.name) + '</div><button class="btn" type="button" id="backBtn" data-closepanel="1">Back to scores</button></div>';
  var score = '<div class="sscore"><div class="tm' + (loseA ? ' dim' : '') + '">' + logo(g.away) + '<span>' + esc(g.away.name) + '</span></div>' +
    '<div class="mid"><b>' + esc(g.state === 'pre' ? 'vs' : (g.away.score == null ? '-' : g.away.score) + ' : ' + (g.home.score == null ? '-' : g.home.score)) + '</b><span class="' + (live ? 'live' : '') + '">' + esc(status) + '</span></div>' +
    '<div class="tm r' + (loseH ? ' dim' : '') + '"><span>' + esc(g.home.name) + '</span>' + logo(g.home) + '</div></div>';
  var body;
  if (gameData === null && !gameErr) body = '<p class="hint">Loading stats&hellip;</p>';
  else if (!gameData) body = '<p class="hint">' + (gameErr ? esc(gameErr) : 'Detailed stats are not available for this game.') + '</p>';
  else body = detailBody(gameData, g) || '<p class="hint">Detailed stats are not available yet. They usually appear once the game starts.</p>';
  var old = $('pbody'), top = old && !first ? old.scrollTop : 0;
  $('panel').innerHTML = head + score + chanLine(g) + '<div class="pbody" id="pbody">' + lineScore(g) + body + '</div>';
  $('panel').hidden = false;
  $('stage').classList.add('split');
  $('pbody').scrollTop = top;
  if (first) { autoScroll.pos = 0; autoScroll.wrap = false; autoScroll.pauseUntil = performance.now() + 3000; }
  markSelected();
}

// Slowly scrolls the stats panel top to bottom, rests at the end, then starts again.
function autoScrollStep(ts) {
  requestAnimationFrame(autoScrollStep);
  var dt = Math.min(ts - (autoScroll.last || ts), 100);
  autoScroll.last = ts;
  var b = openGid ? $('pbody') : null;
  if (!b || autoScroll.hover || ts < autoScroll.pauseUntil) return;
  var max = b.scrollHeight - b.clientHeight;
  if (max < 8) return;                                       // everything fits, nothing to scroll
  if (autoScroll.wrap) { autoScroll.wrap = false; autoScroll.pos = 0; b.scrollTop = 0; autoScroll.pauseUntil = ts + 3000; return; }
  if (autoScroll.pos == null || Math.abs(b.scrollTop - autoScroll.pos) > 2) autoScroll.pos = b.scrollTop;   // someone scrolled by hand
  var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  autoScroll.pos += dt / 1000 * rem * 1.8;
  if (autoScroll.pos >= max) { autoScroll.pos = max; b.scrollTop = max; autoScroll.wrap = true; autoScroll.pauseUntil = ts + 3500; return; }
  b.scrollTop = autoScroll.pos;
}

async function loadGame() {
  var gid = openGid, g = findGame(gid);
  if (!g) return;
  try {
    var d = await fetchSummary(g);
    if (openGid !== gid) return;
    gameData = d || false; gameErr = '';
  } catch (e) {
    if (openGid !== gid) return;
    if (!gameData) gameErr = 'Could not load stats (' + (e.message || e) + ')';
  }
  renderGame(false);
}

function openGame(gid) {
  if (!findGame(gid)) return;
  openGid = gid; gameData = null; gameErr = '';
  renderGame(true);
  loadGame();
}

/* ---------- input ---------- */
['mousemove', 'keydown', 'click', 'touchstart'].forEach(function (ev) {
  document.addEventListener(ev, function () { lastInput = Date.now(); }, { passive: true });
});

document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.closest) return;
  if (t.id === 'overlay') { closeOverlay(); return; }
  var card = t.closest('.card[data-gid]');
  if (card) {
    var gid = card.getAttribute('data-gid');
    if (gid === openGid) closePanel(); else openGame(gid);     // a second click on the same game closes the panel
    return;
  }
  if (t.closest('[data-closepanel]')) { closePanel(); return; }
  if (t.closest('#gear')) { renderSettings(true); return; }
  if (t.closest('[data-close]')) { closeOverlay(); return; }
  var act = t.closest('[data-act]');
  if (act) {
    if (act.getAttribute('data-act') === 'allon') settings.off = {};
    else LEAGUES.forEach(function (l) { settings.off[l.id] = true; });
    renderSettings(false);
    applySettings();
  }
});

document.addEventListener('keydown', function (e) {
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.classList && t.classList.contains('card')) {
    e.preventDefault();
    var gid = t.getAttribute('data-gid');
    if (gid === openGid) closePanel(); else openGame(gid);
    return;
  }
  var typing = t && /^(SELECT|INPUT|TEXTAREA)$/.test(t.tagName);
  if (e.key === 'Escape' || (e.key === 'Backspace' && !typing)) {
    if (overlayMode) { e.preventDefault(); closeOverlay(); }
    else if (openGid) { e.preventDefault(); closePanel(); }
  }
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (overlayMode !== 'settings' || !t || !t.getAttribute) return;
  var id = t.getAttribute('data-lg');
  if (id) {
    if (t.checked) delete settings.off[id]; else settings.off[id] = true;
  } else {
    var isFrom = t.hasAttribute('data-from');
    id = t.getAttribute(isFrom ? 'data-from' : 'data-to');
    if (!id) return;
    var w = settings.win[id] || [null, null];
    w[isFrom ? 0 : 1] = t.value === '' ? null : parseInt(t.value, 10);
    if (w[0] == null && w[1] == null) delete settings.win[id]; else settings.win[id] = w;
  }
  applySettings();
});

(function () {
  var pn = $('panel');
  function hold(ms) { autoScroll.pos = null; autoScroll.pauseUntil = performance.now() + ms; }
  pn.addEventListener('wheel', function () { hold(10000); }, { passive: true });
  pn.addEventListener('touchstart', function () { hold(10000); }, { passive: true });
  pn.addEventListener('mouseenter', function () { autoScroll.hover = true; });
  pn.addEventListener('mouseleave', function () { autoScroll.hover = false; hold(3000); });
  requestAnimationFrame(autoScrollStep);
})();

function tick() {
  $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

tick();
setInterval(tick, 1000);
refresh().then(loadNews);
setInterval(refresh, REFRESH_MS);
setInterval(loadNews, 10 * 60 * 1000);
setInterval(function () {
  if (overlayMode || Date.now() - lastInput < 20000) return;   // stay put while someone is looking at a game or using the cursor
  if (pages.length > 1) pageIndex = (pageIndex + 1) % pages.length;
  renderPage();
}, PAGE_MS);
setInterval(function () { if (overlayMode === 'game' && openGid) loadGame(); }, 30000);   // keep an open game current
setInterval(function () { buildPages(); renderTicker(); renderNews(); }, 5 * 60 * 1000);  // apply time-of-day windows as they start and end
</script>
</body>
</html>
